name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync web assets
        run: npx cap sync android

      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/33.0.2"
          openssl pkcs8 -topk8 -inform PEM -outform DER -in signing/key.pem -out /tmp/key.pk8 -nocrypt
          openssl x509 -in signing/cert.pem -outform DER -out /tmp/cert.der
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/app-aligned.apk
          "$BT/apksigner" sign --key /tmp/key.pk8 --cert /tmp/cert.der --out hs-math-study.apk /tmp/app-aligned.apk
          "$BT/apksigner" verify hs-math-study.apk
          ls -la hs-math-study.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hs-math-study-apk
          path: hs-math-study.apk
          retention-days: 60
